<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DocuPilot platform architecture</title>
  <desc id="desc">Browser UI connects through a FastAPI application to three features and shared model, OCR, and session services.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18243b" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#68758e"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17233b}
      .title{font-size:29px;font-weight:750;letter-spacing:-.5px}
      .subtitle{font-size:14px;fill:#64718a}
      .label{font-size:14px;font-weight:700}
      .body{font-size:12px;fill:#586680}
      .tiny{font-size:10px;fill:#64718a}
      .card{stroke:#dce3ed;stroke-width:1.2}
      .flow{fill:none;stroke:#68758e;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f7fb"/>
  <text class="title" x="56" y="62">DocuPilot · platform architecture</text>
  <text class="subtitle" x="56" y="89">One web application, three focused workflows, and shared AI services</text>

  <rect x="45" y="143" width="235" height="470" rx="22" fill="#eef2ff" stroke="#ccd5ff" stroke-dasharray="5 5"/>
  <text class="label" x="68" y="180">Client</text>
  <text class="tiny" x="68" y="201">Browser · unified interface</text>
  <g filter="url(#shadow)">
    <rect class="card" x="68" y="231" width="189" height="104" rx="15" fill="#fff"/>
    <rect x="68" y="231" width="7" height="104" rx="4" fill="#5875e8"/>
    <text class="label" x="91" y="270">Single-page UI</text>
    <text class="body" x="91" y="294">Chat · uploads · results</text>
    <text class="tiny" x="91" y="316">HTML · CSS · JavaScript</text>
    <rect class="card" x="68" y="366" width="189" height="104" rx="15" fill="#fff"/>
    <rect x="68" y="366" width="7" height="104" rx="4" fill="#11a982"/>
    <text class="label" x="91" y="405">Live responses</text>
    <text class="body" x="91" y="429">Data Agent · SSE stream</text>
    <text class="tiny" x="91" y="451">Support chat · request/response</text>
    <rect class="card" x="68" y="501" width="189" height="82" rx="15" fill="#fff"/>
    <text class="label" x="91" y="535">Consent controls</text>
    <text class="body" x="91" y="558">Before external processing</text>
  </g>

  <rect x="323" y="143" width="235" height="470" rx="22" fill="#eaf7f0" stroke="#c7e7d5" stroke-dasharray="5 5"/>
  <text class="label" x="346" y="180">Application API</text>
  <text class="tiny" x="346" y="201">FastAPI · main.py</text>
  <g filter="url(#shadow)">
    <rect class="card" x="346" y="231" width="189" height="88" rx="15" fill="#fff"/>
    <text class="label" x="369" y="268">Feature routers</text>
    <text class="body" x="369" y="292">Chat · upload · download</text>
    <rect class="card" x="346" y="350" width="189" height="88" rx="15" fill="#fff"/>
    <text class="label" x="369" y="387">Input validation</text>
    <text class="body" x="369" y="411">Session IDs · file limits</text>
    <rect class="card" x="346" y="469" width="189" height="88" rx="15" fill="#fff"/>
    <text class="label" x="369" y="506">Shared configuration</text>
    <text class="body" x="369" y="530">Providers · thresholds</text>
  </g>

  <rect x="601" y="143" width="340" height="470" rx="22" fill="#fff4dc" stroke="#f3d99f" stroke-dasharray="5 5"/>
  <text class="label" x="624" y="180">Product workflows</text>
  <text class="tiny" x="624" y="201">Independent feature modules</text>
  <g filter="url(#shadow)">
    <rect class="card" x="624" y="226" width="294" height="105" rx="15" fill="#fff"/>
    <circle cx="651" cy="257" r="13" fill="#e9a72e"/>
    <text x="651" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text class="label" x="675" y="261">Spreadsheet Data Agent</text>
    <text class="body" x="647" y="291">LangGraph · Pandas · optional web search</text>
    <text class="tiny" x="647" y="313">Workbook analysis · streamed answer</text>
    <rect class="card" x="624" y="357" width="294" height="105" rx="15" fill="#fff"/>
    <circle cx="651" cy="388" r="13" fill="#8264df"/>
    <text x="651" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text class="label" x="675" y="392">Document Assistant</text>
    <text class="body" x="647" y="422">BM25-style retrieval · cited answers</text>
    <text class="tiny" x="647" y="444">Knowledge base · session documents</text>
    <rect class="card" x="624" y="488" width="294" height="96" rx="15" fill="#fff"/>
    <circle cx="651" cy="519" r="13" fill="#238fc0"/>
    <text x="651" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text class="label" x="675" y="523">Document Intelligence</text>
    <text class="body" x="647" y="553">OCR · extraction · confidence review</text>
    <text class="tiny" x="647" y="574">Consent-gated · downloadable results</text>
  </g>

  <rect x="984" y="143" width="251" height="470" rx="22" fill="#eaf2ff" stroke="#c6d8fa" stroke-dasharray="5 5"/>
  <text class="label" x="1007" y="180">Shared services</text>
  <text class="tiny" x="1007" y="201">External providers · local session state</text>
  <g filter="url(#shadow)">
    <rect class="card" x="1007" y="231" width="205" height="104" rx="15" fill="#fff"/>
    <text class="label" x="1030" y="270">LLM providers</text>
    <text class="body" x="1030" y="294">Gemini · Azure OpenAI</text>
    <text class="tiny" x="1030" y="316">Shared factory · fallback</text>
    <rect class="card" x="1007" y="366" width="205" height="91" rx="15" fill="#fff"/>
    <text class="label" x="1030" y="404">Google Document AI</text>
    <text class="body" x="1030" y="428">Page OCR · confidence</text>
    <rect class="card" x="1007" y="488" width="205" height="96" rx="15" fill="#fff"/>
    <text class="label" x="1030" y="525">Application state</text>
    <text class="body" x="1030" y="549">In-memory sessions · files</text>
    <text class="tiny" x="1030" y="571">Local generated exports</text>
  </g>

  <path class="flow" d="M280 385H323"/>
  <path class="flow" d="M558 385H601"/>
  <path class="flow" d="M941 385H984"/>
  <text class="tiny" x="294" y="370">HTTP</text>
  <text class="tiny" x="568" y="370">route</text>
  <text class="tiny" x="949" y="370">service</text>
  <rect x="45" y="646" width="1190" height="1" fill="#dce3ed"/>
  <text class="tiny" x="56" y="675">External services are called only when a workflow needs them; document uploads require explicit consent.</text>
</svg>
