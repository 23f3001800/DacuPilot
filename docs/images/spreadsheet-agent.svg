<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Spreadsheet Data Agent workflow</title>
  <desc id="desc">Excel workbooks are loaded into an in-memory DataFrame. User questions are verified by prompt injection guardrails, processed by a LangGraph analyst reasoning loop with a secured Pandas REPL and Tavily web search, and returned via real-time SSE event streaming.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#302b20" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#292929"/></marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#414141"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202124}
      .title{font-size:26px;font-weight:750}.group{font-size:16px;font-weight:750}.head{font-size:14px;font-weight:700}.body{font-size:12px}.sub{font-size:11px;fill:#4b4b4b}
      .zone{stroke:#555;stroke-width:1.4;stroke-dasharray:3 4}.card{stroke:#292929;stroke-width:1.2;filter:url(#shadow)}.arrow{fill:none;stroke:#292929;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#414141;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrow-dash)}
    </style>
  </defs>
  <rect width="1280" height="800" fill="#fffefa"/>
  <text class="title" x="640" y="40" text-anchor="middle">Spreadsheet Data Agent — Conversational Analytics Workflow</text>
  <text class="sub" x="640" y="63" text-anchor="middle">In-Memory DataFrame · Prompt Guardrail · LangGraph Agent Loop · Sandboxed Pandas Execution · SSE Stream</text>

  <!-- Workbook Loading -->
  <rect class="zone" x="45" y="98" width="1190" height="187" rx="23" fill="#fff2c9"/>
  <text class="group" x="640" y="128" text-anchor="middle">Workbook Ingestion &amp; Schema Extraction</text>
  <rect class="card" x="80" y="158" width="205" height="98" rx="13" fill="#ffc13d"/>
  <text class="head" x="182" y="186" text-anchor="middle">Excel Input</text><text class="body" x="182" y="208" text-anchor="middle">.xlsx or .xlsm · max 20 MB</text><text class="sub" x="182" y="228" text-anchor="middle">Default workbook or upload</text><text class="sub" x="182" y="244" text-anchor="middle">POST /api/data/upload</text>
  <rect class="card" x="377" y="158" width="205" height="98" rx="13" fill="#ffc13d"/>
  <text class="head" x="479" y="186" text-anchor="middle">Schema Loader</text><text class="body" x="479" y="208" text-anchor="middle">Column names &amp; data types</text><text class="sub" x="479" y="228" text-anchor="middle">Total row &amp; metrics inspection</text><text class="sub" x="479" y="244" text-anchor="middle">GET /api/data/schema</text>
  <rect class="card" x="674" y="158" width="205" height="98" rx="13" fill="#ffc13d"/>
  <text class="head" x="776" y="186" text-anchor="middle">Active DataFrame</text><text class="body" x="776" y="208" text-anchor="middle">Pandas dataset in memory</text><text class="sub" x="776" y="228" text-anchor="middle">Thread-safe data binding</text><text class="sub" x="776" y="244" text-anchor="middle">Upload updates current data</text>
  <rect class="card" x="971" y="158" width="205" height="98" rx="13" fill="#ffc13d"/>
  <text class="head" x="1073" y="186" text-anchor="middle">Analyst Schema Context</text><text class="body" x="1073" y="208" text-anchor="middle">Dynamic prompt context</text><text class="sub" x="1073" y="228" text-anchor="middle">Columns + summary stats</text><text class="sub" x="1073" y="244" text-anchor="middle">Supplied to agent reasoning</text>
  <path class="arrow" d="M285 207H369"/><path class="arrow" d="M582 207H666"/><path class="arrow" d="M879 207H963"/>

  <!-- Browser UI -->
  <rect class="zone" x="45" y="326" width="220" height="340" rx="23" fill="#eef4e5"/>
  <text class="group" x="155" y="356" text-anchor="middle">Client UI</text>
  <rect class="card" x="71" y="386" width="168" height="98" rx="12" fill="#d8e8c7"/>
  <text class="head" x="155" y="414" text-anchor="middle">User Question</text><text class="body" x="155" y="436" text-anchor="middle">Query + thread ID</text><text class="sub" x="155" y="456" text-anchor="middle">Natural language query</text><text class="sub" x="155" y="472" text-anchor="middle">Auto-scroll chat history</text>
  <rect class="card" x="71" y="524" width="168" height="110" rx="12" fill="#d8e8c7"/>
  <text class="head" x="155" y="550" text-anchor="middle">Real-Time Chat</text><text class="body" x="155" y="570" text-anchor="middle">Token streaming display</text><text class="sub" x="155" y="588" text-anchor="middle">Tool execution spinners</text><text class="sub" x="155" y="604" text-anchor="middle">Latency badge (⚡ ms)</text><text class="sub" x="155" y="620" text-anchor="middle">Markdown &amp; table render</text>
  <path class="dash" d="M71 579H58V435H63"/>

  <!-- API Layer & Security -->
  <rect class="zone" x="295" y="326" width="232" height="340" rx="23" fill="#eef4e5"/>
  <text class="group" x="411" y="356" text-anchor="middle">API &amp; Guardrails</text>
  <rect class="card" x="323" y="386" width="176" height="98" rx="12" fill="#d8e8c7"/>
  <text class="head" x="411" y="414" text-anchor="middle">POST /api/chat/stream</text><text class="body" x="411" y="436" text-anchor="middle">Prompt injection check</text><text class="sub" x="411" y="456" text-anchor="middle">Rejects jailbreak patterns</text><text class="sub" x="411" y="472" text-anchor="middle">Disarms malicious prompts</text>
  <rect class="card" x="323" y="524" width="176" height="110" rx="12" fill="#d8e8c7"/>
  <text class="head" x="411" y="550" text-anchor="middle">SSE Stream Generator</text><text class="body" x="411" y="570" text-anchor="middle">event: status</text><text class="body" x="411" y="586" text-anchor="middle">event: tool_start</text><text class="body" x="411" y="602" text-anchor="middle">event: token / latency</text><text class="sub" x="411" y="620" text-anchor="middle">data: [DONE] sentinel</text>
  <path class="arrow" d="M265 435H315"/><path class="dash" d="M323 579H273"/>

  <!-- LangGraph Loop -->
  <rect class="zone" x="557" y="326" width="395" height="340" rx="23" fill="#e1edfb"/>
  <text class="group" x="754" y="356" text-anchor="middle">LangGraph Analyst Loop</text>
  <rect class="card" x="584" y="386" width="160" height="98" rx="12" fill="#91bee9"/>
  <text class="head" x="664" y="414" text-anchor="middle">Analyst Reasoner</text><text class="body" x="664" y="436" text-anchor="middle">Streams tokens live</text><text class="sub" x="664" y="456" text-anchor="middle">Decides analysis logic</text><text class="sub" x="664" y="472" text-anchor="middle">Selects Pandas or Search</text>
  <rect class="card" x="768" y="386" width="160" height="98" rx="12" fill="#91bee9"/>
  <text class="head" x="848" y="414" text-anchor="middle">Tool Execution</text><text class="body" x="848" y="436" text-anchor="middle">Sandboxed REPL tool</text><text class="sub" x="848" y="456" text-anchor="middle">Emits tool_start event</text><text class="sub" x="848" y="472" text-anchor="middle">Feeds output to agent</text>
  <rect class="card" x="676" y="524" width="160" height="110" rx="12" fill="#91bee9"/>
  <text class="head" x="756" y="550" text-anchor="middle">Evaluator Node</text><text class="body" x="756" y="570" text-anchor="middle">Computes metrics</text><text class="sub" x="756" y="588" text-anchor="middle">Synthesizes answer</text><text class="sub" x="756" y="604" text-anchor="middle">Records latency</text><text class="sub" x="756" y="620" text-anchor="middle">Emits final sentinel</text>
  <path class="arrow" d="M744 435H760"/><path class="arrow" d="M848 484V512H836"/><path class="arrow" d="M676 579H631V484H664"/>
  <path class="arrow" d="M500 435H576"/><path class="dash" d="M584 435H531V579H500"/>

  <!-- Secured Tools -->
  <rect class="zone" x="982" y="326" width="253" height="340" rx="23" fill="#f3e9f7"/>
  <text class="group" x="1108" y="356" text-anchor="middle">Secured Tools</text>
  <rect class="card" x="1006" y="386" width="205" height="106" rx="12" fill="#ead8f4"/>
  <text class="head" x="1108" y="414" text-anchor="middle">Sandboxed Pandas REPL</text><text class="body" x="1108" y="436" text-anchor="middle">execute_pandas_code</text><text class="sub" x="1108" y="456" text-anchor="middle">Restricted Python context</text><text class="sub" x="1108" y="472" text-anchor="middle">Blocks os, sys, eval, open</text>
  <rect class="card" x="1006" y="524" width="205" height="110" rx="12" fill="#ead8f4"/>
  <text class="head" x="1108" y="550" text-anchor="middle">Tavily Web Search</text><text class="body" x="1108" y="570" text-anchor="middle">web_search_lookup</text><text class="sub" x="1108" y="590" text-anchor="middle">Real-time domain grounding</text><text class="sub" x="1108" y="606" text-anchor="middle">Requires TAVILY_API_KEY</text>
  <path class="arrow" d="M928 435H998"/><path class="dash" d="M1006 459H963V480H848"/>
  <path class="dash" d="M928 455H975V579H1006"/><path class="dash" d="M1006 599H966V480H848"/>

  <text class="sub" x="640" y="726" text-anchor="middle">Tool results return to the agent loop; server-sent events carry response tokens and tool notices incrementally.</text>
  <text class="sub" x="640" y="748" text-anchor="middle">The active DataFrame is shared application context; conversational thread IDs isolate session chat history.</text>
</svg>
