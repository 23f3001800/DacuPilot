<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" role="img" aria-labelledby="title desc">
  <title id="title">Spreadsheet Data Agent workflow</title>
  <desc id="desc">An Excel workbook is loaded into a shared DataFrame. Questions flow from the browser through a FastAPI SSE route to a LangGraph agent, which can call a Pandas execution tool or Tavily search before returning streamed answer chunks.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#302b20" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#292929"/></marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#414141"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202124}
      .title{font-size:27px;font-weight:750}.group{font-size:17px;font-weight:750}.head{font-size:14px;font-weight:700}.body{font-size:13px}.sub{font-size:11px;fill:#4b4b4b}
      .zone{stroke:#555;stroke-width:1.4;stroke-dasharray:3 4}.card{stroke:#292929;stroke-width:1.2;filter:url(#shadow)}.arrow{fill:none;stroke:#292929;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#414141;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrow-dash)}
    </style>
  </defs>
  <rect width="1280" height="770" fill="#fffefa"/>
  <text class="title" x="640" y="43" text-anchor="middle">Spreadsheet Data Agent — Question to Answer</text>
  <text class="sub" x="640" y="66" text-anchor="middle">Workbook context · tool-assisted analysis · server-sent event response</text>

  <rect class="zone" x="45" y="111" width="1190" height="187" rx="23" fill="#fff2c9"/>
  <text class="group" x="640" y="142" text-anchor="middle">Workbook Loading</text>
  <rect class="card" x="80" y="174" width="205" height="90" rx="13" fill="#ffc13d"/>
  <text class="head" x="182" y="205" text-anchor="middle">Excel input</text><text class="body" x="182" y="229" text-anchor="middle">.xlsx or .xlsm · max 20 MB</text><text class="sub" x="182" y="249" text-anchor="middle">Default workbook or upload</text>
  <rect class="card" x="377" y="174" width="205" height="90" rx="13" fill="#ffc13d"/>
  <text class="head" x="479" y="205" text-anchor="middle">Loader</text><text class="body" x="479" y="229" text-anchor="middle">Read workbook and inspect</text><text class="sub" x="479" y="249" text-anchor="middle">Column names · data types</text>
  <rect class="card" x="674" y="174" width="205" height="90" rx="13" fill="#ffc13d"/>
  <text class="head" x="776" y="205" text-anchor="middle">Active DataFrame</text><text class="body" x="776" y="229" text-anchor="middle">Pandas dataset in memory</text><text class="sub" x="776" y="249" text-anchor="middle">Upload replaces current data</text>
  <rect class="card" x="971" y="174" width="205" height="90" rx="13" fill="#ffc13d"/>
  <text class="head" x="1073" y="205" text-anchor="middle">Agent context</text><text class="body" x="1073" y="229" text-anchor="middle">Schema + dataset prompt</text><text class="sub" x="1073" y="249" text-anchor="middle">Available to each question</text>
  <path class="arrow" d="M285 219H369"/><path class="arrow" d="M582 219H666"/><path class="arrow" d="M879 219H963"/>

  <rect class="zone" x="45" y="337" width="220" height="302" rx="23" fill="#eef4e5"/>
  <text class="group" x="155" y="369" text-anchor="middle">Browser</text>
  <rect class="card" x="71" y="399" width="168" height="81" rx="12" fill="#d8e8c7"/>
  <text class="head" x="155" y="430" text-anchor="middle">Question</text><text class="body" x="155" y="454" text-anchor="middle">Message + thread ID</text>
  <rect class="card" x="71" y="522" width="168" height="81" rx="12" fill="#d8e8c7"/>
  <text class="head" x="155" y="553" text-anchor="middle">Chat response</text><text class="body" x="155" y="577" text-anchor="middle">Tokens arrive incrementally</text>
  <path class="dash" d="M71 563H58V439H64"/>

  <rect class="zone" x="302" y="337" width="222" height="302" rx="23" fill="#eef4e5"/>
  <text class="group" x="413" y="369" text-anchor="middle">API Layer</text>
  <rect class="card" x="328" y="399" width="170" height="81" rx="12" fill="#d8e8c7"/>
  <text class="head" x="413" y="430" text-anchor="middle">POST /api/chat/stream</text><text class="body" x="413" y="454" text-anchor="middle">Validates chat request</text>
  <rect class="card" x="328" y="522" width="170" height="81" rx="12" fill="#d8e8c7"/>
  <text class="head" x="413" y="553" text-anchor="middle">SSE events</text><text class="body" x="413" y="577" text-anchor="middle">status · token · error · done</text>
  <path class="arrow" d="M265 439H320"/><path class="dash" d="M328 563H273"/>

  <rect class="zone" x="561" y="337" width="388" height="302" rx="23" fill="#e1edfb"/>
  <text class="group" x="755" y="369" text-anchor="middle">LangGraph Agent Loop</text>
  <rect class="card" x="588" y="399" width="156" height="81" rx="12" fill="#91bee9"/>
  <text class="head" x="666" y="430" text-anchor="middle">Reasoning node</text><text class="body" x="666" y="454" text-anchor="middle">Streams model chunks</text>
  <rect class="card" x="766" y="399" width="156" height="81" rx="12" fill="#91bee9"/>
  <text class="head" x="844" y="430" text-anchor="middle">Tool decision</text><text class="body" x="844" y="454" text-anchor="middle">Use tool or answer</text>
  <rect class="card" x="677" y="522" width="156" height="81" rx="12" fill="#91bee9"/>
  <text class="head" x="755" y="553" text-anchor="middle">Final evaluation</text><text class="body" x="755" y="577" text-anchor="middle">Summary + metrics</text>
  <path class="arrow" d="M744 439H758"/><path class="arrow" d="M844 480V504H833"/><path class="arrow" d="M677 562H631V488H666"/>
  <path class="arrow" d="M524 439H580"/><path class="dash" d="M588 439H531V563H506"/>

  <rect class="zone" x="986" y="337" width="249" height="302" rx="23" fill="#f3e9f7"/>
  <text class="group" x="1110" y="369" text-anchor="middle">Optional Tools</text>
  <rect class="card" x="1012" y="399" width="197" height="81" rx="12" fill="#ead8f4"/>
  <text class="head" x="1110" y="430" text-anchor="middle">Pandas executor</text><text class="body" x="1110" y="454" text-anchor="middle">Run analysis against DataFrame</text>
  <rect class="card" x="1012" y="522" width="197" height="81" rx="12" fill="#ead8f4"/>
  <text class="head" x="1110" y="553" text-anchor="middle">Tavily web search</text><text class="body" x="1110" y="577" text-anchor="middle">Requires configured API key</text>
  <path class="arrow" d="M922 439H1004"/><path class="dash" d="M1004 463H957V480H844"/>
  <path class="dash" d="M922 455H973V562H1004"/><path class="dash" d="M1004 586H966V480H844"/>

  <text class="sub" x="640" y="691" text-anchor="middle">Tool results return to the agent loop; server-sent events carry response chunks back to the browser.</text>
  <text class="sub" x="640" y="718" text-anchor="middle">The workbook dataset is shared by the running application and is not scoped to a chat thread.</text>
</svg>
