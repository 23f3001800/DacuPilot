<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Document Intelligence processing flow</title>
  <desc id="desc">After explicit consent, PDF and image uploads are split into pages, sent to Google Document AI for OCR, classified and extracted by the language model, scored for confidence, and returned with review flags and exports.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18243b" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#68758e"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17233b}
      .title{font-size:29px;font-weight:750;letter-spacing:-.5px}
      .subtitle{font-size:14px;fill:#64718a}
      .label{font-size:14px;font-weight:700}
      .body{font-size:12px;fill:#586680}
      .tiny{font-size:10px;fill:#64718a}
      .card{stroke:#dce3ed;stroke-width:1.2}
      .flow{fill:none;stroke:#68758e;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f7fb"/>
  <text class="title" x="56" y="62">Document Intelligence · processing flow</text>
  <text class="subtitle" x="56" y="89">Explicit consent first; uncertain or high-risk values remain subject to human review</text>

  <rect x="48" y="127" width="1184" height="130" rx="22" fill="#fff4dc" stroke="#f3d99f" stroke-dasharray="5 5"/>
  <text class="label" x="72" y="161">Upload and page preparation</text>
  <g filter="url(#shadow)">
    <rect class="card" x="76" y="181" width="229" height="57" rx="13" fill="#fff"/>
    <text class="label" x="97" y="206">Consent + upload</text>
    <text class="tiny" x="97" y="225">PDF · JPEG · PNG · WebP</text>
    <rect class="card" x="377" y="181" width="229" height="57" rx="13" fill="#fff"/>
    <text class="label" x="398" y="206">Validate and segment</text>
    <text class="tiny" x="398" y="225">PDF pages → page images</text>
    <rect class="card" x="678" y="181" width="229" height="57" rx="13" fill="#fff"/>
    <text class="label" x="699" y="206">Document page</text>
    <text class="tiny" x="699" y="225">Image bytes + source page</text>
    <rect class="card" x="979" y="181" width="229" height="57" rx="13" fill="#fff"/>
    <text class="label" x="1000" y="206">External processing allowed</text>
    <text class="tiny" x="1000" y="225">Google OCR + configured LLM</text>
  </g>
  <path class="flow" d="M305 210H377"/>
  <path class="flow" d="M606 210H678"/>
  <path class="flow" d="M907 210H979"/>

  <text class="label" x="56" y="309">Extraction and confidence review</text>
  <g filter="url(#shadow)">
    <rect class="card" x="54" y="339" width="207" height="144" rx="16" fill="#eaf2ff"/>
    <circle cx="81" cy="369" r="14" fill="#238fc0"/>
    <text x="81" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text class="label" x="105" y="374">OCR</text>
    <text class="body" x="78" y="407">Google Cloud Document AI</text>
    <text class="body" x="78" y="431">Text + OCR confidence</text>
    <text class="tiny" x="78" y="458">Requires GCP processor config</text>

    <rect class="card" x="307" y="339" width="207" height="144" rx="16" fill="#f1edff"/>
    <circle cx="334" cy="369" r="14" fill="#8264df"/>
    <text x="334" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text class="label" x="358" y="374">Classify</text>
    <text class="body" x="331" y="407">Select document schema</text>
    <text class="body" x="331" y="431">Use OCR text and page image</text>
    <text class="tiny" x="331" y="458">Configured LLM provider</text>

    <rect class="card" x="560" y="339" width="207" height="144" rx="16" fill="#f1edff"/>
    <circle cx="587" cy="369" r="14" fill="#8264df"/>
    <text x="587" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text class="label" x="611" y="374">Extract fields</text>
    <text class="body" x="584" y="407">Structured field values</text>
    <text class="body" x="584" y="431">Confidence + handwriting flag</text>
    <text class="tiny" x="584" y="458">Schema-checked output</text>

    <rect class="card" x="813" y="339" width="207" height="144" rx="16" fill="#eaf7f0"/>
    <circle cx="840" cy="369" r="14" fill="#11a982"/>
    <text x="840" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text class="label" x="864" y="374">Evaluate</text>
    <text class="body" x="837" y="407">Validation + field scoring</text>
    <text class="body" x="837" y="431">Threshold + handwriting penalty</text>
    <text class="tiny" x="837" y="458">Flag low-confidence results</text>

    <rect class="card" x="1066" y="339" width="160" height="144" rx="16" fill="#fff0ef"/>
    <circle cx="1093" cy="369" r="14" fill="#dd625a"/>
    <text x="1093" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
    <text class="label" x="1117" y="374">Review</text>
    <text class="body" x="1090" y="407">Human verifies</text>
    <text class="body" x="1090" y="431">Flagged values</text>
    <text class="tiny" x="1090" y="458">No auto-approval</text>
  </g>
  <path class="flow" d="M261 410H307"/>
  <path class="flow" d="M514 410H560"/>
  <path class="flow" d="M767 410H813"/>
  <path class="flow" d="M1020 410H1066"/>

  <rect x="48" y="535" width="1184" height="128" rx="22" fill="#eaf7f0" stroke="#c7e7d5" stroke-dasharray="5 5"/>
  <text class="label" x="72" y="569">Results</text>
  <g filter="url(#shadow)">
    <rect class="card" x="76" y="587" width="300" height="54" rx="13" fill="#fff"/>
    <text class="label" x="98" y="620">Structured document results</text>
    <rect class="card" x="490" y="587" width="300" height="54" rx="13" fill="#fff"/>
    <text class="label" x="512" y="620">Review report · flagged fields</text>
    <rect class="card" x="904" y="587" width="300" height="54" rx="13" fill="#fff"/>
    <text class="label" x="926" y="620">Download JSON and Excel</text>
  </g>
  <path class="flow" d="M1146 483V515H226V587"/>
  <path class="flow" d="M640 515V587"/>
  <path class="flow" d="M1146 515V587"/>
  <text class="tiny" x="56" y="693">Uploads are sent to external services only after explicit consent. Scores are review signals, not proof of accuracy.</text>
</svg>
