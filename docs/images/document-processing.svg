<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" role="img" aria-labelledby="title desc">
  <title id="title">Document Intelligence extraction and review flow</title>
  <desc id="desc">Consented PDF and image uploads are validated and segmented, sent to Google Document AI for OCR, passed to an LLM for classification and structured extraction, then scored and returned with human-review flags and downloadable outputs.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#302b20" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#292929"/></marker>
    <marker id="arrow-dash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#414141"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#202124}
      .title{font-size:27px;font-weight:750}.group{font-size:17px;font-weight:750}.head{font-size:14px;font-weight:700}.body{font-size:13px}.sub{font-size:11px;fill:#4b4b4b}
      .zone{stroke:#555;stroke-width:1.4;stroke-dasharray:3 4}.card{stroke:#292929;stroke-width:1.2;filter:url(#shadow)}.arrow{fill:none;stroke:#292929;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#414141;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrow-dash)}
    </style>
  </defs>
  <rect width="1280" height="770" fill="#fffefa"/>
  <text class="title" x="640" y="43" text-anchor="middle">Document Intelligence — Extraction &amp; Review</text>
  <text class="sub" x="640" y="66" text-anchor="middle">Consent-gated page processing with explicit confidence and human-review signals</text>

  <rect class="zone" x="44" y="112" width="1192" height="190" rx="23" fill="#fff2c9"/>
  <text class="group" x="640" y="143" text-anchor="middle">Upload &amp; Page Preparation</text>
  <rect class="card" x="76" y="177" width="211" height="89" rx="13" fill="#ffc13d"/>
  <text class="head" x="181" y="208" text-anchor="middle">User upload + consent</text><text class="body" x="181" y="232" text-anchor="middle">PDF · JPEG · PNG · WebP</text><text class="sub" x="181" y="251" text-anchor="middle">Consent required</text>
  <rect class="card" x="368" y="177" width="211" height="89" rx="13" fill="#ffc13d"/>
  <text class="head" x="473" y="208" text-anchor="middle">Validate input</text><text class="body" x="473" y="232" text-anchor="middle">File type · size · page count</text><text class="sub" x="473" y="251" text-anchor="middle">Reject invalid documents</text>
  <rect class="card" x="660" y="177" width="211" height="89" rx="13" fill="#ffc13d"/>
  <text class="head" x="765" y="208" text-anchor="middle">Segment into pages</text><text class="body" x="765" y="232" text-anchor="middle">Render PDF pages as images</text><text class="sub" x="765" y="251" text-anchor="middle">Keep source and page number</text>
  <rect class="card" x="952" y="177" width="211" height="89" rx="13" fill="#ffc13d"/>
  <text class="head" x="1057" y="208" text-anchor="middle">Consent boundary</text><text class="body" x="1057" y="232" text-anchor="middle">External OCR and model APIs</text><text class="sub" x="1057" y="251" text-anchor="middle">Only after user authorization</text>
  <path class="arrow" d="M287 222H360"/><path class="arrow" d="M579 222H652"/><path class="arrow" d="M871 222H944"/>

  <rect class="zone" x="44" y="346" width="255" height="285" rx="23" fill="#e1edfb"/>
  <text class="group" x="171" y="378" text-anchor="middle">OCR Service</text>
  <rect class="card" x="75" y="411" width="193" height="82" rx="12" fill="#91bee9"/>
  <text class="head" x="171" y="442" text-anchor="middle">Google Document AI</text><text class="body" x="171" y="466" text-anchor="middle">OCR each page image</text>
  <rect class="card" x="75" y="528" width="193" height="70" rx="12" fill="#91bee9"/>
  <text class="head" x="171" y="556" text-anchor="middle">OCR response</text><text class="body" x="171" y="579" text-anchor="middle">Recognized text + confidence</text>
  <path class="arrow" d="M171 493V520"/>

  <rect class="zone" x="339" y="346" width="358" height="285" rx="23" fill="#e1edfb"/>
  <text class="group" x="518" y="378" text-anchor="middle">LLM Extraction</text>
  <rect class="card" x="371" y="411" width="294" height="82" rx="12" fill="#91bee9"/>
  <text class="head" x="518" y="442" text-anchor="middle">Classify document</text><text class="body" x="518" y="466" text-anchor="middle">Choose supported document schema</text>
  <rect class="card" x="371" y="528" width="294" height="70" rx="12" fill="#91bee9"/>
  <text class="head" x="518" y="556" text-anchor="middle">Extract typed fields</text><text class="body" x="518" y="579" text-anchor="middle">Value · confidence · handwriting flag</text>
  <path class="arrow" d="M518 493V520"/>

  <rect class="zone" x="737" y="346" width="255" height="285" rx="23" fill="#eef4e5"/>
  <text class="group" x="864" y="378" text-anchor="middle">Evaluation</text>
  <rect class="card" x="768" y="411" width="193" height="82" rx="12" fill="#d8e8c7"/>
  <text class="head" x="864" y="442" text-anchor="middle">Validate + score</text><text class="body" x="864" y="466" text-anchor="middle">Threshold + risk adjustment</text>
  <rect class="card" x="768" y="528" width="193" height="70" rx="12" fill="#d8e8c7"/>
  <text class="head" x="864" y="556" text-anchor="middle">Review decision</text><text class="body" x="864" y="579" text-anchor="middle">Flag low-confidence fields</text>
  <path class="arrow" d="M864 493V520"/>

  <rect class="zone" x="1032" y="346" width="204" height="285" rx="23" fill="#f9e1dc"/>
  <text class="group" x="1134" y="378" text-anchor="middle">Results</text>
  <rect class="card" x="1055" y="411" width="158" height="82" rx="12" fill="#ead8f4"/>
  <text class="head" x="1134" y="442" text-anchor="middle">Human review</text><text class="body" x="1134" y="466" text-anchor="middle">Verify flagged values</text>
  <rect class="card" x="1055" y="528" width="158" height="70" rx="12" fill="#ead8f4"/>
  <text class="head" x="1134" y="556" text-anchor="middle">Downloads</text><text class="body" x="1134" y="579" text-anchor="middle">JSON · report · Excel</text>

  <path class="dash" d="M1057 266V316H171V403"/>
  <path class="arrow" d="M268 452H363"/><path class="arrow" d="M665 452H760"/><path class="arrow" d="M961 452H1047"/>
  <path class="arrow" d="M864 598V648H1134V606"/>
  <text class="sub" x="640" y="689" text-anchor="middle">Scores are review signals, not proof of correctness. The system does not automatically approve documents.</text>
  <text class="sub" x="640" y="716" text-anchor="middle">Service credentials: Google Cloud Document AI · configured Gemini or Azure OpenAI-compatible model</text>
</svg>
