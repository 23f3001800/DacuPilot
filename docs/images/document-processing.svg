<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Multimodal extraction with one OCR retry</title><desc id="desc">Validated image results skip OCR. Uncertain or failed results get one OCR-assisted attempt.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#17243b}.title{font-size:28px;font-weight:700}.subtitle{font-size:16px;fill:#526278}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#40516a}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1200" height="650" rx="16" fill="#f5f7fb"/>
<text x="36" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17243b">Multimodal extraction with one OCR retry</text><text x="36" y="77" font-family="Arial, sans-serif" font-size="16" fill="#526278">Validated image results skip OCR. Uncertain or failed results get one OCR-assisted attempt.</text>
<path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" d="M386 170H417"/>
<path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" d="M775 170H806"/>
<path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" d="M989 229V302"/>
<path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" d="M989 229V270H211V302"/>
<path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" d="M814 382H783"/>
<path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" d="M425 382H394"/>
<rect x="36" y="110" width="350" height="119" rx="12" fill="white" stroke="#d6dfec"/><rect x="36" y="122" width="4" height="95" rx="2" fill="#3759cc"/>
<text x="56" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">1 · Consent and pages</text>
<text x="56" y="171" font-family="Arial, sans-serif" font-size="15" fill="#40516a">PDF / JPEG / PNG / WebP</text>
<text x="56" y="196" font-family="Arial, sans-serif" font-size="15" fill="#40516a">20 files · 20 MB · 50 PDF pages</text>
<text x="56" y="221" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Render PDF pages at 1.5× scale</text>
<rect x="425" y="110" width="350" height="119" rx="12" fill="white" stroke="#d6dfec"/><rect x="425" y="122" width="4" height="95" rx="2" fill="#1b8b68"/>
<text x="445" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">2 · Read the image</text>
<text x="445" y="171" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Image + schema → multimodal model</text>
<text x="445" y="196" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Classify and extract visible fields</text>
<text x="445" y="221" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Record confidence per field</text>
<rect x="814" y="110" width="350" height="119" rx="12" fill="white" stroke="#d6dfec"/><rect x="814" y="122" width="4" height="95" rx="2" fill="#7c51c9"/>
<text x="834" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">3 · Apply retry gates</text>
<text x="834" y="171" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Unknown or low-score classification</text>
<text x="834" y="196" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Missing, invalid, or uncertain fields</text>
<text x="834" y="221" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Pass → step 6 · otherwise → step 4</text>
<rect x="814" y="310" width="350" height="146" rx="12" fill="white" stroke="#d6dfec"/><rect x="814" y="322" width="4" height="122" rx="2" fill="#3759cc"/>
<text x="834" y="342" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">4 · One OCR-assisted retry</text>
<text x="834" y="371" font-family="Arial, sans-serif" font-size="15" fill="#40516a">OCR uses Azure → Google → vision</text>
<text x="834" y="396" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Text → classify → schema extraction</text>
<text x="834" y="421" font-family="Arial, sans-serif" font-size="15" fill="#40516a">No repeat-until-confident loop</text>
<text x="834" y="446" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Preserve provider fallback events</text>
<rect x="425" y="310" width="350" height="146" rx="12" fill="white" stroke="#d6dfec"/><rect x="425" y="322" width="4" height="122" rx="2" fill="#1b8b68"/>
<text x="445" y="342" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">5 · Compare attempts</text>
<text x="445" y="371" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Prefer fewer review items</text>
<text x="445" y="396" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Break ties with classification score</text>
<text x="445" y="421" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Conflicting values → human review</text>
<text x="445" y="446" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Store method and attempt status</text>
<rect x="36" y="310" width="350" height="146" rx="12" fill="white" stroke="#d6dfec"/><rect x="36" y="322" width="4" height="122" rx="2" fill="#3759cc"/>
<text x="56" y="342" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">6 · Review and export</text>
<text x="56" y="371" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Preserve flags across grouped pages</text>
<text x="56" y="396" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Documents JSON and Excel</text>
<text x="56" y="421" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Review report and evaluation JSON</text>
<text x="56" y="446" font-family="Arial, sans-serif" font-size="15" fill="#40516a">SSE completion + download links</text>
<rect x="36" y="535" width="1128" height="85" rx="12" fill="white" stroke="#d6dfec"/><rect x="36" y="547" width="4" height="61" rx="2" fill="#7c51c9"/>
<text x="56" y="567" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">Evaluation with labeled references</text>
<text x="56" y="596" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Classification exact match · field exact match · character error rate · routing · exports · measured stage latency</text>
</svg>