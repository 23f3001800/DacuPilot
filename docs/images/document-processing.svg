<text x="56" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">1 · Intake and consent</text>
<text x="56" y="171" font-family="Arial, sans-serif" font-size="15" fill="#40516a">PDF / JPEG / PNG / WebP</text>
<text x="56" y="196" font-family="Arial, sans-serif" font-size="15" fill="#40516a">20 files · 20 MB each</text>
<text x="56" y="221" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Up to 50 pages per PDF</text>
<rect x="425" y="110" width="350" height="119" rx="12" fill="white" stroke="#d6dfec"/><rect x="425" y="122" width="4" height="95" rx="2" fill="#1b8b68"/>
<text x="445" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">2 · Segment pages</text>
<text x="445" y="171" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Render PDF pages at 1.5× scale</text>
<text x="445" y="196" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Keep source file and page number</text>
<text x="445" y="221" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Process pages sequentially</text>
<rect x="814" y="110" width="350" height="119" rx="12" fill="white" stroke="#d6dfec"/><rect x="814" y="122" width="4" height="95" rx="2" fill="#7c51c9"/>
<text x="834" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">3 · Recognize text</text>
<text x="834" y="171" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Azure Document Intelligence</text>
<text x="834" y="196" font-family="Arial, sans-serif" font-size="15" fill="#40516a">↓ on failure Google Document AI</text>
<text x="834" y="221" font-family="Arial, sans-serif" font-size="15" fill="#40516a">↓ on failure vision model OCR</text>
<rect x="814" y="310" width="350" height="146" rx="12" fill="white" stroke="#d6dfec"/><rect x="814" y="322" width="4" height="122" rx="2" fill="#3759cc"/>
<text x="834" y="342" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">4 · Classify and extract</text>
<text x="834" y="371" font-family="Arial, sans-serif" font-size="15" fill="#40516a">LLM classification from OCR text</text>
<text x="834" y="396" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Ten supported document schemas</text>
<text x="834" y="421" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Identity / form extraction route</text>
<text x="834" y="446" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Preserve OCR provider in traces</text>
<rect x="425" y="310" width="350" height="146" rx="12" fill="white" stroke="#d6dfec"/><rect x="425" y="322" width="4" height="122" rx="2" fill="#1b8b68"/>
<text x="445" y="342" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">5 · Validate and review</text>
<text x="445" y="371" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Required fields and format checks</text>
<text x="445" y="396" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Field score minus handwriting penalty</text>
<text x="445" y="421" font-family="Arial, sans-serif" font-size="15" fill="#40516a">0.85 field review threshold</text>
<text x="445" y="446" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Flag uncertain or missing values</text>
<rect x="36" y="310" width="350" height="146" rx="12" fill="white" stroke="#d6dfec"/><rect x="36" y="322" width="4" height="122" rx="2" fill="#3759cc"/>
<text x="56" y="342" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">6 · Group and export</text>
<text x="56" y="371" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Group document continuation pages</text>
<text x="56" y="396" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Documents JSON and Excel</text>
<text x="56" y="421" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Review report and evaluation JSON</text>
<text x="56" y="446" font-family="Arial, sans-serif" font-size="15" fill="#40516a">SSE completion + download links</text>
<rect x="36" y="535" width="1128" height="85" rx="12" fill="white" stroke="#d6dfec"/><rect x="36" y="547" width="4" height="61" rx="2" fill="#7c51c9"/>
<text x="56" y="567" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17243b">Evaluation with labeled references</text>
<text x="56" y="596" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Classification exact match · field exact match · character error rate · routing · exports · measured stage latency</text>
