<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Data Agent request and streaming flow</title>
  <desc id="desc">A workbook is loaded as a dataset. A user question flows through the chat API and LangGraph agent, which can use Pandas or web search and streams answer chunks to the browser.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18243b" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#68758e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#3976d8"/>
    </marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17233b}
      .title{font-size:29px;font-weight:750;letter-spacing:-.5px}
      .subtitle{font-size:14px;fill:#64718a}
      .label{font-size:14px;font-weight:700}
      .body{font-size:12px;fill:#586680}
      .tiny{font-size:10px;fill:#64718a}
      .card{stroke:#dce3ed;stroke-width:1.2}
      .flow{fill:none;stroke:#68758e;stroke-width:2;marker-end:url(#arrow)}
      .stream{fill:none;stroke:#3976d8;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow-blue)}
    </style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="#f5f7fb"/>
  <text class="title" x="56" y="62">Spreadsheet Data Agent · request flow</text>
  <text class="subtitle" x="56" y="89">Workbook context and question-aware tools feed an incremental chat response</text>

  <rect x="44" y="139" width="1192" height="219" rx="22" fill="#fff4dc" stroke="#f3d99f" stroke-dasharray="5 5"/>
  <text class="label" x="69" y="174">Dataset setup</text>
  <g filter="url(#shadow)">
    <rect class="card" x="75" y="207" width="220" height="104" rx="15" fill="#fff"/>
    <rect x="75" y="207" width="7" height="104" rx="4" fill="#e9a72e"/>
    <text class="label" x="101" y="247">Excel workbook</text>
    <text class="body" x="101" y="271">.xlsx · .xlsm · 20 MB max</text>
    <text class="tiny" x="101" y="292">User upload or default file</text>
    <rect class="card" x="375" y="207" width="220" height="104" rx="15" fill="#fff"/>
    <rect x="375" y="207" width="7" height="104" rx="4" fill="#e9a72e"/>
    <text class="label" x="401" y="247">Schema discovery</text>
    <text class="body" x="401" y="271">Columns · types · row count</text>
    <text class="tiny" x="401" y="292">Workbook parser</text>
    <rect class="card" x="675" y="207" width="220" height="104" rx="15" fill="#fff"/>
    <rect x="675" y="207" width="7" height="104" rx="4" fill="#e9a72e"/>
    <text class="label" x="701" y="247">Active dataset</text>
    <text class="body" x="701" y="271">Pandas DataFrame</text>
    <text class="tiny" x="701" y="292">Shared by the running app</text>
  </g>
  <path class="flow" d="M295 259H375"/>
  <path class="flow" d="M595 259H675"/>
  <path class="flow" d="M895 259H1010"/>
  <rect x="1010" y="207" width="187" height="104" rx="15" fill="#fff" stroke="#dce3ed" stroke-width="1.2"/>
  <text class="label" x="1034" y="247">Workbook context</text>
  <text class="body" x="1034" y="271">Added to the agent prompt</text>
  <text class="tiny" x="1034" y="292">Replaced on next upload</text>

  <text class="label" x="56" y="407">Question and answer</text>
  <g filter="url(#shadow)">
    <rect class="card" x="54" y="438" width="190" height="122" rx="16" fill="#eef2ff"/>
    <text class="label" x="78" y="478">Browser chat</text>
    <text class="body" x="78" y="503">Question + thread ID</text>
    <text class="tiny" x="78" y="526">Fetch stream reader</text>
    <rect class="card" x="310" y="438" width="205" height="122" rx="16" fill="#eaf7f0"/>
    <text class="label" x="334" y="478">FastAPI route</text>
    <text class="body" x="334" y="503">POST /api/chat/stream</text>
    <text class="tiny" x="334" y="526">SSE status · tokens · errors</text>
    <rect class="card" x="587" y="438" width="255" height="122" rx="16" fill="#fff4dc"/>
    <text class="label" x="611" y="478">LangGraph agent</text>
    <text class="body" x="611" y="503">Reason · choose tools · evaluate</text>
    <text class="tiny" x="611" y="526">Conversation checkpoint by thread</text>
    <rect class="card" x="928" y="405" width="284" height="89" rx="16" fill="#eaf2ff"/>
    <text class="label" x="952" y="443">Pandas analysis tool</text>
    <text class="body" x="952" y="467">Executes agent-generated analysis</text>
    <rect class="card" x="928" y="515" width="284" height="89" rx="16" fill="#eaf2ff"/>
    <text class="label" x="952" y="553">Optional Tavily search</text>
    <text class="body" x="952" y="577">Requires TAVILY_API_KEY</text>
  </g>
  <path class="flow" d="M244 479H310"/>
  <path class="flow" d="M515 479H587"/>
  <path class="flow" d="M842 470C879 470 884 449 928 449"/>
  <path class="flow" d="M842 517C883 517 887 559 928 559"/>
  <path class="stream" d="M587 544C560 620 375 620 337 560"/>
  <path class="stream" d="M310 542C261 635 139 633 141 561"/>
  <text x="399" y="633" font-size="11" font-weight="700" fill="#3976d8">Answer chunks return to the browser as server-sent events</text>
  <rect x="54" y="668" width="1158" height="1" fill="#dce3ed"/>
  <text class="tiny" x="56" y="693">The active workbook is application-wide, not isolated per chat session.</text>
</svg>
