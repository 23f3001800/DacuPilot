<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>DocuPilot | Intelligent Document &amp; Data Processing</title>
  <link rel="stylesheet" href="/ui/data-upload.css">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #15244a;
      background: #f6f8fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --blue: #155eef;
      --purple: #6938ef;
      --green: #039855;
      --muted: #667085;
      --line: #e4e9f2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; }
    .topbar { height: 62px; position: fixed; inset: 0 0 auto; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; color: #101d47; font-size: 21px; font-weight: 800; letter-spacing: -.7px; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; color: white; background: linear-gradient(145deg, #176bff, #532bde); font-size: 17px; }
    .brand-caption { margin-left: 8px; padding-left: 16px; border-left: 1px solid #d7ddec; color: #66718e; font-size: 12px; font-weight: 500; letter-spacing: 0; }
    .top-actions { display: flex; align-items: center; gap: 22px; color: #344054; }
    .status { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; background: #e7f9f0; color: #027a48; font-size: 11px; font-weight: 650; }
    .status.offline { background: #fff1f0; color: #b42318; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .profile { display: flex; align-items: center; gap: 10px; border-left: 1px solid #d7ddec; padding-left: 20px; font-size: 12px; }
    .profile-avatar { display: grid; place-items: center; width: 33px; height: 33px; border-radius: 50%; background: #155eef; color: white; font-weight: 700; }
    .profile small { display: block; color: var(--muted); margin-top: 2px; }
    .layout { display: flex; padding-top: 62px; min-height: 100vh; }
    .sidebar { width: 176px; position: fixed; inset: 62px auto 0 0; display: flex; flex-direction: column; padding: 14px 10px; border-right: 1px solid var(--line); background: white; }
    .nav { display: grid; gap: 5px; }
    .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 8px 11px; border: 0; border-radius: 9px; background: transparent; color: #34405e; text-align: left; font-size: 12px; font-weight: 650; }
    .nav-item:hover { background: #f4f6fb; }
    .nav-item.active { background: #eaf1ff; color: #155eef; }
    .nav-icon { width: 20px; text-align: center; font-size: 17px; }
    .nav-copy small { display: block; margin-top: 2px; color: #77819a; font-size: 10px; font-weight: 450; }
    .nav-divider { height: 1px; margin: 14px 5px; background: var(--line); }
    .sidebar-foot { margin-top: auto; padding: 14px 10px; border-radius: 13px; background: linear-gradient(135deg, #eef2ff, #f6f8ff); color: #536283; font-size: 10px; line-height: 1.5; }
    .sidebar-foot strong { display: block; color: #2f4382; font-size: 11px; }
    main { width: calc(100% - 176px); margin-left: 176px; padding: 28px clamp(22px, 4vw, 55px) 50px; }
    .page { width: min(1180px, 100%); margin: 0 auto; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 13px; padding: 7px 12px; border-radius: 999px; background: #f0edff; color: #5925dc; font-size: 11px; font-weight: 700; }
    .home-hero { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 24px; min-height: 248px; }
    h1 { margin: 0; color: #101d47; font-size: clamp(33px, 4vw, 47px); line-height: 1.08; letter-spacing: -1.8px; }
    .gradient { background: linear-gradient(90deg, #155eef, #6938ef); background-clip: text; color: transparent; font-size: 1.14em; }
    .hero-copy { max-width: 560px; margin: 12px 0 0; color: #42506e; font-size: 14px; line-height: 1.65; }
    .hero-art { min-height: 200px; position: relative; display: grid; place-items: center; }
    .paper-stack { position: relative; width: 205px; height: 150px; transform: rotate(-6deg); }
    .paper { position: absolute; width: 130px; height: 155px; border: 1px solid #bfceff; border-radius: 15px; background: linear-gradient(145deg, #fff, #e9f1ff); box-shadow: 0 18px 38px #4975de2b; }
    .paper:before, .paper:after { content: ""; position: absolute; left: 23px; width: 75px; height: 7px; border-radius: 9px; background: #a7bfff; }
    .paper:before { top: 45px; box-shadow: 0 21px #c4d2ff, 0 42px #c4d2ff, 0 63px #d8e1ff; }
    .paper:after { top: 24px; width: 39px; height: 9px; background: #6d8fff; }
    .paper.p1 { left: 12px; top: 9px; opacity: .55; transform: rotate(-13deg); }
    .paper.p2 { left: 58px; top: 0; opacity: .75; transform: rotate(9deg); }
    .paper.p3 { left: 41px; top: 7px; transform: rotate(-1deg); }
    .float-label { position: absolute; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid #c7d7fe; border-radius: 14px; background: #fff; color: #344b95; box-shadow: 0 8px 24px #34405412; font-size: 10px; font-weight: 700; }
    .float-label.left { left: 2%; top: 20px; }
    .float-label.right { right: 0; top: 38px; color: #5925dc; border-color: #ddd6fe; }
    .float-label.bottom { right: 0; bottom: 8px; color: #027a48; border-color: #abefc6; }
    .section-heading { margin: 12px 0 4px; color: #101d47; font-size: 21px; letter-spacing: -.5px; }
    .section-sub { margin: 0 0 18px; color: #667085; font-size: 12px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .capability { min-height: 230px; display: flex; flex-direction: column; padding: 19px; border: 1px solid; border-radius: 13px; }
    .capability.blue { border-color: #b2ddff; background: linear-gradient(135deg, #eff8ff, #f2f7ff); }
    .capability.purple { border-color: #d9d6fe; background: linear-gradient(135deg, #f4f3ff, #faf8ff); }
    .capability.green { border-color: #a6f4c5; background: linear-gradient(135deg, #ecfdf3, #f1fff7); }
    .cap-head { display: flex; align-items: center; gap: 13px; }
    .cap-icon { flex: 0 0 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; font-size: 24px; }
    .blue .cap-icon { color: #067647; background: #c8f5dd; }
    .purple .cap-icon { color: #5925dc; background: #e4dcff; }
    .green .cap-icon { color: #027a48; background: #c8f5dd; }
    .cap-head h3 { margin: 0; color: #101d47; font-size: 17px; letter-spacing: -.4px; }
    .cap-copy { margin: 13px 0 12px; color: #475467; font-size: 12px; line-height: 1.5; }
    .checks { display: grid; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; color: #344054; font-size: 11px; }
    .checks li:before { content: "✓"; margin-right: 8px; color: var(--blue); font-weight: 800; }
    .green .checks li:before { color: var(--green); }
    .cta { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 39px; margin-top: auto; border: 0; border-radius: 9px; color: white; font-size: 12px; font-weight: 700; }
    .blue .cta { background: linear-gradient(90deg, #155eef, #176bff); }
    .purple .cta { background: linear-gradient(90deg, #6938ef, #7a5af8); }
    .green .cta { background: linear-gradient(90deg, #039855, #12b76a); }
    .assurance { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 23px auto 0; color: #74809b; font-size: 10px; }
    .assurance:before, .assurance:after { content: ""; width: min(13vw, 120px); height: 1px; background: #dce3f1; }
    .badges { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
    .badge { padding: 7px 11px; border: 1px solid #edf0f6; border-radius: 999px; background: #fff; color: #42506e; font-size: 10px; }
    .page-title { margin: 2px 0 6px; color: #101d47; font-size: 29px; letter-spacing: -.9px; }
    .page-description { margin: 0 0 22px; color: #667085; font-size: 13px; line-height: 1.5; }
    .panel { padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: 0 5px 20px #101d4708; }
    .panel h2 { margin: 0 0 6px; color: #182b58; font-size: 16px; }
    .panel p { color: #667085; font-size: 12px; line-height: 1.5; }
    .chat-layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .chat-panel { min-height: 470px; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
    .chat-top { padding: 15px 18px; border-bottom: 1px solid var(--line); }
    .chat-top strong { color: #25345a; font-size: 13px; }
    .chat-top span { float: right; color: #039855; font-size: 11px; }
    .chat-messages { flex: 1; min-height: 300px; max-height: 55vh; overflow-y: auto; padding: 18px; }
    .chat-message { display: flex; gap: 9px; margin-bottom: 15px; align-items: flex-start; }
    .chat-message.user { flex-direction: row-reverse; }
    .chat-avatar { display: grid; flex: 0 0 28px; height: 28px; place-items: center; border-radius: 9px; color: #155eef; background: #eaf1ff; font-size: 11px; font-weight: 750; }
    .chat-message.user .chat-avatar { color: #fff; background: #6675d8; }
    .chat-bubble { max-width: calc(100% - 40px); padding: 10px 12px; border-radius: 4px 12px 12px; background: #f2f4f7; color: #344054; font-size: 12px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chat-message.user .chat-bubble { border-radius: 12px 4px 12px 12px; background: #eef1ff; }
    .chat-bubble.error { color: #b42318; background: #fef3f2; }
    .chat-form { display: flex; gap: 9px; margin: 0 14px 13px; padding: 8px; border: 1px solid #d0d5dd; border-radius: 11px; }
    .chat-form textarea { flex: 1; min-height: 38px; max-height: 110px; resize: vertical; padding: 8px; border: 0; outline: 0; color: #182230; font-size: 12px; }
    .attach-button { flex: 0 0 38px; width: 38px; height: 38px; border: 1px solid #d0d5dd; border-radius: 8px; background: #fff; color: #475467; font-size: 22px; line-height: 1; }
    .attach-button:hover { border-color: #98aef1; background: #f8faff; color: var(--blue); }
    .attachment-panel { margin: 0 14px 10px; padding: 12px; border: 1px solid #e4e9f2; border-radius: 10px; background: #fafbff; }
    .attachment-panel[hidden] { display: none; }
    .attachment-files { margin: 0; color: #344054; font-size: 11px; overflow-wrap: anywhere; }
    .attachment-panel .consent { margin: 10px 0; }
    .attachment-actions { display: flex; align-items: center; gap: 8px; }
    .secondary-button { padding: 8px 12px; border: 1px solid #d0d5dd; border-radius: 8px; background: #fff; color: #344054; font-size: 12px; font-weight: 650; }
    .primary-button { border: 0; border-radius: 8px; padding: 9px 14px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 700; }
    .primary-button:disabled { opacity: .55; cursor: wait; }
    .prompt-list { display: grid; gap: 8px; margin-top: 14px; }
    .prompt-button { padding: 10px; border: 1px solid #e5e9f1; border-radius: 9px; background: white; color: #344054; text-align: left; font-size: 11px; }
    .prompt-button:hover { border-color: #b2c7ff; background: #f8faff; }
    .pipeline { display: grid; grid-template-columns: repeat(6, minmax(130px, 1fr)); gap: 10px; overflow-x: auto; padding: 4px 0 16px; }
    .pipeline-step { min-height: 127px; position: relative; padding: 13px; border: 1px solid #d6e4ff; border-radius: 12px; background: linear-gradient(145deg, #fff, #f5f8ff); }
    .pipeline-step:not(:last-child):after { content: "›"; position: absolute; z-index: 1; top: 43%; right: -11px; color: #6e91e8; font-size: 23px; font-weight: 800; }
    .step-number { display: grid; place-items: center; width: 25px; height: 25px; margin-bottom: 9px; border-radius: 8px; background: #eaf1ff; color: #155eef; font-size: 11px; font-weight: 800; }
    .pipeline-step strong { display: block; color: #23345f; font-size: 11px; }
    .pipeline-step small { display: block; margin-top: 5px; color: #667085; font-size: 10px; line-height: 1.4; }
    .pipeline-step.active { border-color: #155eef; background: #eef4ff; box-shadow: 0 0 0 2px #d1e0ff; transition: all .2s ease; }
    .pipeline-step.active .step-number { background: #155eef; color: #fff; }
    .pipeline-step.completed { border-color: #a6f4c5; background: #f6fef9; }
    .pipeline-step.completed .step-number { background: #12b76a; color: #fff; }
    .pipeline-step.completed:after { color: #12b76a; }
    .progress-panel { border: 1px solid #d1e0ff; background: #f8faff; border-radius: 12px; padding: 16px; margin-top: 14px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .progress-title strong { color: #155eef; font-size: 13px; }
    .progress-percent { font-size: 12px; font-weight: 700; color: #155eef; }
    .progress-bar-track { width: 100%; height: 7px; background: #eaecf0; border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar-fill { height: 100%; background: #155eef; border-radius: 99px; transition: width .2s ease; }
    .progress-detail { margin: 0 0 8px; color: #475467; font-size: 11px; }
    .progress-log { max-height: 80px; overflow-y: auto; font-family: monospace; font-size: 10px; color: #667085; display: flex; flex-direction: column; gap: 3px; }
    .progress-log-item { display: flex; gap: 6px; }
    .progress-log-time { color: #98a2b3; }
    .drop-zone { display: grid; place-items: center; min-height: 147px; padding: 22px; border: 1px dashed #98aef1; border-radius: 13px; background: #f9faff; text-align: center; }
    .drop-zone strong { display: block; margin-bottom: 5px; color: #25345a; font-size: 13px; }
    .drop-zone span { color: #667085; font-size: 11px; }
    .file-input { max-width: 100%; margin-top: 14px; color: #475467; font-size: 11px; }
    .consent { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; padding: 13px; border: 1px solid #fedf89; border-radius: 10px; background: #fffaeb; color: #7a2e0e; font-size: 11px; line-height: 1.5; }
    .consent input { margin-top: 2px; accent-color: #155eef; }
    .process-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hint { color: #667085; font-size: 11px; }
    .error-box { margin-top: 13px; padding: 11px 13px; border: 1px solid #fecdca; border-radius: 9px; background: #fef3f2; color: #b42318; font-size: 12px; }
    .results { display: grid; gap: 14px; margin-top: 18px; }
    .result-summary { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: center; }
    .download-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .download-links a { padding: 8px 10px; border: 1px solid #d0d5dd; border-radius: 8px; color: #344054; text-decoration: none; font-size: 11px; }
    .document-result { padding: 15px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
    .document-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 11px; }
    .document-head strong { color: #25345a; font-size: 13px; }
    .document-head small { display: block; margin-top: 4px; color: #667085; font-size: 10px; }
    .pill { padding: 5px 9px; border-radius: 999px; background: #ecfdf3; color: #027a48; font-size: 10px; font-weight: 700; }
    .pill.review { background: #fff4e5; color: #b54708; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .field { padding: 9px 10px; border: 1px solid #edf0f5; border-radius: 8px; background: #fcfcfd; }
    .field-top { display: flex; justify-content: space-between; gap: 8px; color: #667085; font-size: 10px; }
    .field-value { margin-top: 5px; color: #25345a; font-size: 11px; font-weight: 650; overflow-wrap: anywhere; }
    .field-review { margin-top: 4px; color: #b54708; font-size: 9px; }
    .empty-value { color: #98a2b3; font-style: italic; font-weight: 450; }
    .stage-list { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .stage-chip { padding: 5px 7px; border-radius: 6px; background: #f2f4f7; color: #475467; font-size: 9px; }
    .stage-chip.fail { color: #b42318; background: #fef3f2; }
    .about-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .metric { padding: 17px; border: 1px solid var(--line); border-radius: 12px; background: white; }
    .metric strong { display: block; color: #155eef; font-size: 22px; }
    .metric span { display: block; margin-top: 5px; color: #667085; font-size: 11px; }
    .setting-row { display: flex; justify-content: space-between; gap: 15px; padding: 13px 0; border-bottom: 1px solid #edf0f5; color: #344054; font-size: 12px; }
    .setting-row:last-child { border: 0; }
    .setting-row span:last-child { color: #667085; text-align: right; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chat-step { display: inline-flex; align-items: center; gap: 7px; color: #64748b; font-style: italic; font-size: 12px; }
    .chat-spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #cbd5e1; border-top-color: #155eef; border-radius: 50%; animation: spin 0.9s linear infinite; }
    .assistant-fab { position: fixed; right: 22px; bottom: 20px; z-index: 8; width: 46px; height: 46px; border: 0; border-radius: 50%; background: linear-gradient(145deg, #6938ef, #155eef); color: white; box-shadow: 0 9px 25px #5436d744; font-size: 18px; }
    .toast { position: fixed; right: 22px; bottom: 77px; z-index: 8; max-width: 310px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: white; color: #344054; box-shadow: 0 9px 30px #101d471a; font-size: 11px; }
    .toast[hidden] { display: none; }
    @media (max-width: 900px) {
      .sidebar { width: 68px; padding-inline: 8px; }
      .nav-item { justify-content: center; padding: 9px 4px; }
      .nav-copy, .sidebar-foot, .brand-caption, .profile-name { display: none; }
      main { width: calc(100% - 68px); margin-left: 68px; padding-inline: 22px; }
      .cards { grid-template-columns: 1fr; }
      .capability { min-height: 195px; }
      .home-hero { grid-template-columns: 1fr .7fr; }
      .chat-layout { grid-template-columns: 1fr; }
      .prompt-panel { display: none; }
      .pipeline { grid-template-columns: repeat(6, 150px); }
    }
    @media (max-width: 580px) {
      .topbar { height: 56px; padding: 0 13px; }
      .brand { font-size: 18px; }
      .status { padding: 6px 9px; font-size: 10px; }
      .profile { display: none; }
      .sidebar { inset: 56px auto 0 0; width: 56px; }
      .layout { padding-top: 56px; }
      main { width: calc(100% - 56px); margin-left: 56px; padding: 22px 12px 80px; }
      .home-hero { display: block; min-height: auto; }
      .hero-art { min-height: 160px; }
      h1 { font-size: 33px; }
      .hero-copy { font-size: 12px; }
      .field-grid, .about-grid { grid-template-columns: 1fr; }
      .panel { padding: 14px; }
      .assistant-fab { right: 12px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">▤</span><span>DocuPilot</span><span class="brand-caption">Intelligent Document &amp; Data Processing</span></div>
      <div class="top-actions">
        <span class="status" id="system-status"><span class="status-dot"></span>Checking system</span>
        <div class="profile"><span class="profile-avatar">D</span><span class="profile-name">DataPilot<small>Workspace</small></span></div>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <nav class="nav" aria-label="Main navigation">
          <button class="nav-item" data-route="home"><span class="nav-icon">⌂</span><span class="nav-copy">Home</span></button>
          <button class="nav-item" data-route="data-agent"><span class="nav-icon">▤</span><span class="nav-copy">Data Agent<small>Excel Q&amp;A</small></span></button>
          <button class="nav-item" data-route="document-assistant"><span class="nav-icon">▣</span><span class="nav-copy">Document Assistant<small>Chat with documents</small></span></button>
          <button class="nav-item" data-route="document-intelligence"><span class="nav-icon">▧</span><span class="nav-copy">Document Intelligence<small>Classify &amp; extract</small></span></button>
          <div class="nav-divider"></div>
          <button class="nav-item" data-route="about"><span class="nav-icon">ⓘ</span><span class="nav-copy">About</span></button>
          <button class="nav-item" data-route="settings"><span class="nav-icon">⚙</span><span class="nav-copy">Settings</span></button>
        </nav>
        <div class="sidebar-foot"><strong>✦ AI-powered workspace</strong>Tools for data questions, cited document help, and structured extraction.</div>
      </aside>
      <main><div class="page" id="page"></div></main>
    </div>
    <button class="assistant-fab" id="quick-assistant" type="button" aria-label="Ask the document assistant">✦</button>
    <div class="toast" id="toast" hidden></div>
  </div>
  <script>
    const page = document.querySelector("#page");
    const toast = document.querySelector("#toast");
    const navButtons = [...document.querySelectorAll(".nav-item")];
    const newId = () => crypto.randomUUID();
    const sessionKey = "docupilot-thread-";
    const threadFor = name => {
      const key = sessionKey + name;
      let id = sessionStorage.getItem(key);
      if (!id) { id = newId(); sessionStorage.setItem(key, id); }
      return id;
    };
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({

    function addChatMessage(container, text, role, error = false) {
      const row = document.createElement("div");
      row.className = `chat-message ${role}`;
      const avatar = document.createElement("span");
      avatar.className = "chat-avatar";
      avatar.textContent = role === "user" ? "You" : "D";
      const bubble = document.createElement("div");
      bubble.className = `chat-bubble${error ? " error" : ""}`;
      bubble.textContent = text;
      row.append(avatar, bubble);
      container.append(row);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    async function sendDataQuestion(question, mode, controls) {
      const text = question.trim();
      if (!text || controls.button.disabled) return;
      addChatMessage(controls.messages, text, "user");
      controls.input.value = "";
      controls.button.disabled = true;
      controls.button.textContent = "…";
      const answer = addChatMessage(controls.messages, "", "assistant");
      const textContainer = document.createElement("div");
      textContainer.className = "bubble-text";
      textContainer.innerHTML = `<span class="chat-step"><span class="chat-spinner"></span>Thinking…</span>`;
      const metaContainer = document.createElement("div");
      metaContainer.className = "bubble-meta";
      metaContainer.style.cssText = "margin-top:8px;";
      answer.replaceChildren(textContainer, metaContainer);

      try {
        const streamUrl = mode === "document-assistant"
          ? "/api/document-assistant/chat/stream"
          : "/api/chat/stream";
        const response = await fetch(streamUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, thread_id: threadFor(mode) })
        });
        if (!response.ok || !response.body) throw new Error(await responseText(response));
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let receivedToken = false;
        let lastLatencyMs = null;
        let lastEvaluation = null;
        const reqStartTime = performance.now();
        let liveTimer = null;

        function updateLiveLatency() {
          const elapsed = Math.round(performance.now() - reqStartTime);
          metaContainer.innerHTML = `<div style="font-size:11px;color:#dc2626;font-weight:700;display:inline-flex;align-items:center;gap:4px;"><span>⚡</span> Latency: <strong>${elapsed} ms</strong></div>`;
        }
        liveTimer = setInterval(updateLiveLatency, 80);

        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          buffer = buffer.replace(/\r\n/g, "\n");
          const events = buffer.split("\n\n");
          buffer = events.pop() || "";
          for (const event of events) {
            const line = event.split("\n").find(item => item.startsWith("data: "));
            if (!line || line === "data: [DONE]") continue;
            let payload;
            try { payload = JSON.parse(line.slice(6)); } catch (_) { continue; }
            if (payload.event === "status") {
              if (!receivedToken) {
                textContainer.innerHTML = `<span class="chat-step"><span class="chat-spinner"></span>${escapeHtml(payload.text)}</span>`;
              }
            }
            if (payload.event === "tool_start") {
              if (!receivedToken) {
                textContainer.innerHTML = `<span class="chat-step"><span class="chat-spinner"></span>Running ${escapeHtml(payload.tool || "tool")}…</span>`;
              }
            }
            if (payload.event === "token") {
              if (!receivedToken) textContainer.textContent = "";
              receivedToken = true;
              textContainer.textContent += payload.text;
            }
            if (payload.event === "final_answer") {
              textContainer.textContent = payload.text;
            }
            if (payload.event === "evaluation" || payload.event === "metrics_evaluation") {
              lastEvaluation = payload;
              console.log("[DocuPilot Evaluation Matrix]", mode, payload);
            }
            if (payload.event === "latency" && payload.total_ms) {
              lastLatencyMs = payload.total_ms;
            }
            if (payload.event === "error") {
              throw new Error(payload.details || "The assistant failed.");
            }
          }
          if (done) break;
        }
        clearInterval(liveTimer);
        const finalLatency = lastLatencyMs || Math.round(performance.now() - reqStartTime);
        let badgeHtml = `<div class="chat-evaluation-badge" style="font-size:12px;padding:6px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px;"><span style="display:inline-flex;align-items:center;gap:4px;color:#dc2626;font-weight:700;"><span style="color:#dc2626;">⚡</span> Latency: <strong style="color:#dc2626;">${finalLatency} ms</strong></span>`;

        if (lastEvaluation) {
          const p = lastEvaluation.payload || lastEvaluation;
          const conf = lastEvaluation.confidence_score !== undefined
            ? lastEvaluation.confidence_score
            : (p.confidence_score !== undefined ? p.confidence_score : (p.evaluation_metrics && p.evaluation_metrics.confidence_score));
          if (conf !== undefined && conf !== null) {
            const confPct = Math.round(conf * 100);
            const confColor = confPct >= 85 ? "#027a48" : (confPct >= 60 ? "#b54708" : "#dc2626");
            badgeHtml += `<span style="color:#94a3b8;">|</span><span style="display:inline-flex;align-items:center;gap:4px;color:${confColor};font-weight:700;"><span>🎯</span> Confidence: <strong>${confPct}%</strong></span>`;
          }
          const rat = p.evaluation_rationale || (p.evaluation_metrics && p.evaluation_metrics.evaluation_rationale);
          if (rat) {
            badgeHtml += `<span style="color:#94a3b8;">|</span><details style="display:inline;cursor:pointer;"><summary style="font-size:11px;color:#475467;outline:none;display:inline;font-weight:600;">rationale</summary><div style="font-size:11px;color:#344054;margin-top:6px;line-height:1.4;background:#fff;padding:8px 10px;border-radius:6px;border:1px solid #e4e9f2;max-width:550px;white-space:normal;">${escapeHtml(rat)}</div></details>`;
          }
        }
        badgeHtml += `</div>`;
        metaContainer.innerHTML = badgeHtml;
      } catch (error) {
        answer.classList.add("error");
        answer.textContent = error.message || "Could not reach the assistant.";
      } finally {
        controls.button.disabled = false;
        controls.button.textContent = "Send";
        controls.input.focus();
      }
    }

    async function responseText(response) {
      try {
        const payload = await response.json();
        return payload.detail || `Request failed (${response.status}).`;
      } catch (_) {
        return `Request failed (${response.status}).`;
      }
    }

    function wireChat(route) {
      const messages = document.querySelector("#chat-messages");
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#chat-input");
      const button = document.querySelector("#chat-send");
      const controls = { messages, input, button };
      addChatMessage(messages, route === "data-agent"
        ? "Hi! Ask me about the inventory workbook."
        : "Hi! Ask about company information in the Nimbus Orchard Technologies handbook. I’ll cite the source page or section.", "assistant");
      form.addEventListener("submit", event => {
        event.preventDefault();
        sendDataQuestion(input.value, route, controls);
      });
      input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });
      document.querySelectorAll(".prompt-button").forEach(buttonElement => {
        buttonElement.addEventListener("click", () => sendDataQuestion(buttonElement.textContent, route, controls));
      });
      if (route === "data-agent") wireExcelUpload(controls);
    }

    function wireExcelUpload(controls) {
      const form = document.querySelector("#excel-upload-form");
      const fileInput = document.querySelector("#excel-file");
      const submit = document.querySelector("#excel-upload-button");
      const status = document.querySelector("#excel-upload-status");
      let uploadInProgress = false;

      // Query active workbook schema on load so user knows what is ingested
      fetch("/api/data/schema")
        .then(res => res.ok ? res.json() : null)
        .then(schema => {
          if (!schema || !schema.filename || !schema.loaded) {
            if (status) {
              status.style.color = "#b54708";
              status.style.fontWeight = "600";
              status.innerHTML = `⚠️ No Excel workbook uploaded yet. Choose a file to upload it automatically.`;
            }
            return;
          }
          const rows = schema.total_rows != null ? Number(schema.total_rows).toLocaleString() : "";
          const cols = (schema.columns || []).length;
          if (status) {
            status.style.color = "#027a48";
            status.style.fontWeight = "500";
            status.innerHTML = `<span style="font-weight:700;">✓ Ingested Dataset:</span> <strong>${escapeHtml(schema.filename)}</strong> (${rows} rows · ${cols} columns). Choose a file below to replace it.`;
          }
          const sourceBadge = document.querySelector("#excel-data-source");
          if (sourceBadge) {
            sourceBadge.style.display = "inline-flex";
            sourceBadge.innerHTML = `<span>📊</span> <span>Active Dataset: <strong>${escapeHtml(schema.filename)}</strong> (${rows} rows)</span>`;
          }
        })
        .catch(() => {});

      async function uploadWorkbook() {
        if (!fileInput.files.length || uploadInProgress) return;
        const file = fileInput.files[0];
        uploadInProgress = true;
        fileInput.disabled = true;
        submit.disabled = true;
        submit.textContent = "Loading…";
        controls.button.disabled = true;
        controls.input.disabled = true;
        if (status) {
          status.style.color = "#475467";
          status.textContent = `Uploading and ingesting "${file.name}"…`;
        }
        try {
          const body = new FormData();
          body.set("file", fileInput.files[0]);
          const response = await fetch("/api/data/upload", { method: "POST", body });
          if (!response.ok) throw new Error(await responseText(response));
          const workbook = await response.json();
          const latText = workbook.latency_ms ? ` (latency: ${workbook.latency_ms} ms)` : "";
          const rowsFormatted = Number(workbook.total_rows || 0).toLocaleString();
          const colsCount = (workbook.columns || []).length;
          if (status) {
            status.style.color = "#027a48";
            status.style.fontWeight = "600";
            status.innerHTML = `<span style="font-weight:700;">✓ Successfully ingested &amp; loaded:</span> <strong>${escapeHtml(workbook.filename)}</strong> (${rowsFormatted} rows · ${colsCount} columns)${latText}.`;
          }
          const sourceBadge = document.querySelector("#excel-data-source");
          if (sourceBadge) {
            sourceBadge.style.display = "inline-flex";
            sourceBadge.innerHTML = `<span>📊</span> <span>Active Dataset: <strong>${escapeHtml(workbook.filename)}</strong> (${rowsFormatted} rows)</span>`;
          }
          sessionStorage.setItem(sessionKey + "data-agent", newId());
          controls.messages.replaceChildren();
          addChatMessage(controls.messages, `✓ Workbook "${workbook.filename}" is successfully ingested and active (${rowsFormatted} rows, ${colsCount} columns). Ask any analytical or statistical question about its data.`, "assistant");
        } catch (failure) {
          if (status) {
            status.style.color = "#dc2626";
            status.textContent = failure.message || "Could not load the workbook.";
          }
        } finally {
          uploadInProgress = false;
          fileInput.disabled = false;
          submit.disabled = false;
          submit.textContent = "Upload Excel";
          controls.button.disabled = false;
          controls.input.disabled = false;
        }
      }

      fileInput.addEventListener("change", uploadWorkbook);
      form.addEventListener("submit", event => {
        event.preventDefault();
        uploadWorkbook();
      });
    }

    function renderDocuments(result) {
      const results = document.querySelector("#processing-results");
      const downloads = Object.entries(result.outputs || {}).map(([name, url]) =>
        `<a href="${escapeHtml(url)}" download>${name === "excel" ? "Download Excel" : `Download ${name.replaceAll("_", " ")}`}</a>`
      ).join("");
      const cards = result.documents.map((doc, index) => {
        const extraction = doc.extraction || {};
        const dataKey = {
          AADHAAR_CARD: "aadhaar_data", PAN_CARD: "pan_data",
          DRIVING_LICENCE: "driving_licence_data", PASSPORT: "passport_data",
          NACH_MANDATE: "nach_mandate_data", FATCA_ANNEXURE: "fatca_annexure_data",
          BENEFIT_ILLUSTRATION: "benefit_illustration_data",
          MORAL_HAZARD_QUESTIONNAIRE: "moral_hazard_data",
          MULTIPLE_POLICIES_CONSENT: "multiple_policies_data",
          SUITABILITY_PROFILER: "suitability_profiler_data"
        }[doc.document_type];
        const data = dataKey ? (extraction[dataKey] || {}) : {};
        const matrix = extraction.system_evaluation_matrix || {};
        const needsReview = Boolean(doc.error) || matrix.final_routing_decision !== "AUTOMATED_PROCESSING";
        const fieldCards = Object.entries(data).filter(([, value]) => value && typeof value === "object" && "ai_confidence" in value).map(([name, field]) => {
          const flagged = field.requires_human_review;
          return `<div class="field"><div class="field-top"><span>${escapeHtml(name.replaceAll("_", " "))}</span><span>${Math.round((field.final_field_score || 0) * 100)}%</span></div><div class="field-value${field.value ? "" : " empty-value"}">${escapeHtml(field.value || "Not extracted")}</div>${flagged ? `<div class="field-review">Human review · ${escapeHtml(field.ai_confidence < result.threshold ? "Below confidence threshold" : "Validation check")}</div>` : ""}</div>`;
        }).join("");
        const stages = (doc.stage_trace || []).map(stage => {
          let statusText = stage.status;
          if (statusText === "CONFIDENCE_UNAVAILABLE") statusText = "COMPLETED";
          return `<span class="stage-chip${stage.status.includes("FAILED") ? " fail" : stage.status.includes("REVIEW_REQUIRED") ? " review" : ""}">${escapeHtml(stage.stage.replaceAll("_", " "))}: ${escapeHtml(statusText)}${typeof stage.confidence === "number" ? ` · ${Math.round(stage.confidence * 100)}%` : ""}</span>`;
        }).join("");
        const error = doc.error ? `<div class="error-box">${escapeHtml(doc.error)}</div>` : "";
        const ocrLabel = typeof doc.ocr_confidence === "number" ? ` · OCR ${Math.round(doc.ocr_confidence * 100)}%` : "";
        const docLatency = doc.latency_ms ? ` · ${doc.latency_ms}ms` : "";
        return `<article class="document-result"><div class="document-head"><div><strong>${escapeHtml(doc.document_type || "UNKNOWN")} · ${escapeHtml((doc.source_files || [doc.source_file]).join(", "))}</strong><small>Pages ${(doc.pages || [doc.page_number]).join(", ")} · ${escapeHtml(doc.processor_route || "UNCLASSIFIED")} · Classification ${Math.round((doc.classification_confidence || 0) * 100)}%${ocrLabel}${docLatency}</small></div><span class="pill${needsReview ? " review" : ""}">${needsReview ? "Human review" : "Passed confidence shield"}</span></div>${fieldCards ? `<div class="field-grid">${fieldCards}</div>` : ""}${error}<div class="stage-list">${stages}</div></article>`;
      }).join("");
      const review = result.review_report || {};
      const evalMatrices = result.evaluation_matrices || {};
      const latencyVal = result.total_latency_ms || result.latency_ms;
      const latencyBadge = latencyVal ? `<span style="display:inline-block;padding:2px 8px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:9999px;font-size:12px;font-weight:600;margin-left:8px;">⚡ ${latencyVal} ms</span>` : "";

      let evalSection = "";
      if (evalMatrices.quality || evalMatrices.throughput || evalMatrices.routing) {
        const q = evalMatrices.quality || {};
        const t = evalMatrices.throughput || {};
        const r = evalMatrices.routing || {};
        evalSection = `
          <div class="eval-matrices" style="margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
            <div style="background:#f8fafc;padding:12px;border-radius:8px;border:1px solid #e2e8f0;">
              <strong style="color:#1e293b;font-size:13px;display:block;margin-bottom:6px;">📊 Quality Matrix</strong>
              <div style="font-size:12px;color:#475569;line-height:1.6;">
                <div>Avg Class Confidence: <b>${Math.round((q.classification?.mean || 0) * 100)}%</b></div>
                <div>Avg Field Score: <b>${Math.round((q.field_confidence?.mean || 0) * 100)}%</b></div>
                <div>Validation Pass Rate: <b>${Math.round((q.validation_pass_rate || 0) * 100)}%</b></div>
              </div>
            </div>
            <div style="background:#f8fafc;padding:12px;border-radius:8px;border:1px solid #e2e8f0;">
              <strong style="color:#1e293b;font-size:13px;display:block;margin-bottom:6px;">⚡ Throughput Matrix</strong>
              <div style="font-size:12px;color:#475569;line-height:1.6;">
                <div>Total Pipeline Time: <b style="color:#dc2626;">${t.total_ms || latencyVal || 0} ms</b></div>
                <div>Avg Per Page: <b style="color:#dc2626;">${t.avg_ms_per_page || 0} ms</b></div>
                <div>Pages / Sec: <b>${t.pages_per_second || 0}</b></div>
              </div>
            </div>
            <div style="background:#f8fafc;padding:12px;border-radius:8px;border:1px solid #e2e8f0;">
              <strong style="color:#1e293b;font-size:13px;display:block;margin-bottom:6px;">🔄 Routing Matrix</strong>
              <div style="font-size:12px;color:#475569;line-height:1.6;">
                <div>Automation Rate: <b>${Math.round((r.automation_rate || 0) * 100)}%</b></div>
                <div>Review Flags: <b>${r.total_flags ?? 0}</b></div>
                <div>Human Review: <b>${r.human_review_required ? "Required" : "No"}</b></div>
              </div>
            </div>
          </div>
        `;
      }
      results.innerHTML = `<section class="panel"><div class="result-summary"><div><h2>Processing complete ${latencyBadge}</h2><p>${result.document_count} independent document(s) · ${result.page_count} page(s) · review threshold ${Math.round(result.threshold * 100)}%</p><p>${review.flagged_fields?.length || 0} field/document flag(s) for human review</p></div><div class="download-links">${downloads}</div></div>${evalSection}</section>${cards}`;
    }

    function wireDocumentProcessing() {
      const form = document.querySelector("#document-form");
      const consent = document.querySelector("#external-consent");
      const submit = document.querySelector("#process-documents");
      const error = document.querySelector("#processing-error");
      const progressPanel = document.querySelector("#processing-progress-panel");
      const progressHeading = document.querySelector("#progress-heading");
      const progressDetail = document.querySelector("#progress-detail");
      const progressFill = document.querySelector("#progress-bar-fill");
      const progressPercent = document.querySelector("#progress-percent");
      const progressLog = document.querySelector("#progress-log");
      const pipelineSteps = document.querySelectorAll(".pipeline-step");

      function updatePipelineStep(stepIndex) {
        pipelineSteps.forEach((step, idx) => {
          const num = idx + 1;
          if (num < stepIndex) {
            step.classList.remove("active");
            step.classList.add("completed");
          } else if (num === stepIndex) {
            step.classList.add("active");
            step.classList.remove("completed");
          } else {
            step.classList.remove("active", "completed");
          }
        });
      }

      function logEvent(msg, latencyMs) {
        if (!progressLog) return;
        const time = new Date().toLocaleTimeString([], { hour12: false, minute: "2-digit", second: "2-digit" });
        const item = document.createElement("div");
        item.className = "progress-log-item";
        const latBadge = latencyMs ? `<span style="margin-left:auto;color:#ef4444;font-size:11px;font-family:monospace;">+${latencyMs}ms</span>` : "";
        item.innerHTML = `<span class="progress-log-time">${time}</span><span style="flex:1;">${escapeHtml(msg)}</span>${latBadge}`;
        progressLog.appendChild(item);
        progressLog.scrollTop = progressLog.scrollHeight;
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        error.replaceChildren();
        const files = document.querySelector("#document-files").files;
        if (!files.length) { error.innerHTML = `<div class="error-box">Choose at least one document.</div>`; return; }
        if (!consent.checked) { error.innerHTML = `<div class="error-box">Consent is required before these files can be sent to the configured external OCR and AI services.</div>`; return; }
        submit.disabled = true;
        submit.textContent = "Processing…";
        document.querySelector("#processing-results").replaceChildren();

        if (progressPanel) {
          progressPanel.style.display = "block";
          if (progressHeading) progressHeading.textContent = "Processing documents…";
          if (progressDetail) progressDetail.textContent = "Connecting to pipeline…";
          if (progressFill) progressFill.style.width = "0%";
          if (progressPercent) progressPercent.textContent = "0%";
          if (progressLog) progressLog.replaceChildren();
        }
        updatePipelineStep(1);

        try {
          const data = new FormData(form);
          data.set("external_processing_consent", "true");
          let response = await fetch("/api/documents/process/stream", { method: "POST", body: data });
          if (!response.ok && response.status === 404) {
            response = await fetch("/api/documents/process", { method: "POST", body: data });
            if (!response.ok) throw new Error(await responseText(response));
            updatePipelineStep(7);
            if (progressPanel) progressPanel.style.display = "none";
            renderDocuments(await response.json());
            return;
          }
          if (!response.ok) throw new Error(await responseText(response));

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let finalResult = null;

          while (true) {
            const { value, done } = await reader.read();
            buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
            buffer = buffer.replace(/\r\n/g, "\n");
            const events = buffer.split("\n\n");
            buffer = events.pop() || "";

            for (const raw of events) {
              const line = raw.trim();
              if (!line.startsWith("data:")) continue;
              let payload;
              try {
                payload = JSON.parse(line.slice(5).trim());
              } catch (_) {
                continue;
              }

              if (payload.type === "progress") {
                const stage = payload.stage;
                let stepNum = 1;
                let pct = 10;

                if (stage === "upload" || stage === "segmentation") {
                  stepNum = 1;
                  pct = 15;
                } else if (stage === "ocr") {
                  stepNum = 3;
                  pct = 30;
                } else if (stage === "classification") {
                  stepNum = 2;
                  pct = 45;
                } else if (stage === "extraction" || stage === "page_start" || stage === "page_complete") {
                  stepNum = 3;
                  pct = 60;
                } else if (stage === "validation") {
                  stepNum = 4;
                  pct = 75;
                } else if (stage === "confidence_shield" || stage === "grouping" || stage === "review") {
                  stepNum = 5;
                  pct = 88;
                } else if (stage === "export") {
                  stepNum = 6;
                  pct = 96;
                }

                if (payload.total_pages && payload.current_page) {
                  const pageBase = (payload.current_page - 1) / payload.total_pages;
                  const pageFraction = 1 / payload.total_pages;
                  let subFraction = 0.2;
                  if (stage === "ocr") subFraction = 0.25;
                  else if (stage === "classification") subFraction = 0.5;
                  else if (stage === "extraction") subFraction = 0.75;
                  else if (stage === "validation") subFraction = 0.9;
                  else if (stage === "confidence_shield") subFraction = 1.0;
                  const computedPct = Math.round(15 + (pageBase + pageFraction * subFraction) * 70);
                  pct = Math.max(pct, Math.min(computedPct, 92));
                }

                updatePipelineStep(stepNum);
                if (progressHeading) progressHeading.textContent = `Pipeline active: Step ${stepNum} of 6`;
                if (progressDetail) progressDetail.textContent = payload.message || "Processing…";
                if (progressFill) progressFill.style.width = `${pct}%`;
                if (progressPercent) progressPercent.textContent = `${pct}%`;
                if (payload.message) logEvent(payload.message, payload.latency_ms);

              } else if (payload.type === "complete") {
                finalResult = payload.result;
                updatePipelineStep(7);
                if (progressFill) progressFill.style.width = "100%";
                if (progressPercent) progressPercent.textContent = "100%";
                if (progressDetail) progressDetail.textContent = "Processing complete!";
                logEvent("Job completed successfully", finalResult?.total_latency_ms || finalResult?.latency_ms);
              } else if (payload.type === "error") {
                throw new Error(payload.message || "Document processing failed.");
              }
            }

            if (done) break;
          }

          if (finalResult) {
            if (progressPanel) progressPanel.style.display = "none";
            renderDocuments(finalResult);
          } else {
            throw new Error("Pipeline finished without returning results.");
          }
        } catch (failure) {
          error.innerHTML = `<div class="error-box">${escapeHtml(failure.message || "Document processing failed.")}</div>`;
        } finally {
          submit.disabled = false;
          submit.textContent = "Classify and extract";
        }
      });
    }

    function render() {
      const route = location.hash.replace(/^#\/?/, "") || "home";
      const known = ["home", "data-agent", "document-assistant", "document-intelligence", "about", "settings"];
      const activeRoute = known.includes(route) ? route : "home";
      navButtons.forEach(button => button.classList.toggle("active", button.dataset.route === activeRoute));
      page.innerHTML = pageContent(activeRoute);
      if (activeRoute === "data-agent" || activeRoute === "document-assistant") wireChat(activeRoute);
      if (activeRoute === "document-intelligence") wireDocumentProcessing();
      page.querySelectorAll("[data-go]").forEach(button => button.addEventListener("click", () => navigate(button.dataset.go)));
      window.scrollTo(0, 0);
    }

    function navigate(route) { location.hash = `/${route}`; }
    navButtons.forEach(button => button.addEventListener("click", () => navigate(button.dataset.route)));
    document.querySelector("#quick-assistant").addEventListener("click", () => navigate("document-assistant"));
    window.addEventListener("hashchange", render);
    fetch("/api/health").then(response => {
      if (!response.ok) throw new Error("offline");
      document.querySelector("#system-status").innerHTML = `<span class="status-dot"></span>System Online`;
    }).catch(() => {
      const status = document.querySelector("#system-status");
      status.classList.add("offline");
      status.textContent = "System Offline";
    });
    fetch("/api/documents/settings").then(async response => {
      if (!response.ok) throw new Error(`Settings request failed (${response.status}).`);
      return response.json();
    }).then(settings => {
      window.DOCUPILOT_SETTINGS = settings;
      if (["settings", "document-intelligence"].includes(location.hash.replace(/^#\/?/, ""))) render();
    }).catch(failure => showToast(`Could not load AI settings: ${failure.message}`));
    render();
  </script>
</body>
